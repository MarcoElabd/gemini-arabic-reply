<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- 10% outer margin: 26px padding on all sides (204x204 box at 26,26) -->
  <rect x="26" y="26" width="204" height="204" rx="44" fill="url(#bg)" stroke="url(#accent)" stroke-width="6" />
  <!-- RTL Isolate Brackets U+2067 .. U+2069 visual representation -->
  <path d="M 200 76 L 212 76 L 212 180 L 200 180" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 56 76 L 44 76 L 44 180 L 56 180" fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arabic Letter Ain (ع) in the center -->
  <text x="128" y="156" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="108" font-weight="bold" fill="#f8fafc" text-anchor="middle">ع</text>
  <!-- RTL Direction Arrow at the bottom -->
  <path d="M 176 198 L 80 198 M 96 186 L 80 198 L 96 210" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
